name: Website bauen und veröffentlichen

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Daten laden und Website erzeugen
        run: node scripts/build.mjs --write-snapshot data/snapshot.json

      - name: Datenstand im Repository festhalten
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "dv-transparenz-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "Datenstand $(date -u +%Y-%m-%dT%H:%MZ)"
            # Hat ein paralleler Lauf inzwischen gepusht, auf den neuesten Stand setzen
            # (bei Konflikten in data/ gilt der eigene, neuere Datenstand). Scheitert das,
            # wird nur der Datenstand-Commit ausgelassen; die Website wird trotzdem veröffentlicht.
            for versuch in 1 2 3; do
              git push && exit 0
              git fetch origin main
              if ! git rebase -X theirs origin/main; then
                git rebase --abort || true
                break
              fi
            done
            echo "::warning::Datenstand konnte nicht ins Repository geschrieben werden; der nächste Lauf holt das nach."
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
